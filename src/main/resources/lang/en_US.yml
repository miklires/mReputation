prefix: "<blue><bold>mReputation</bold></blue> <dark_gray>»</dark_gray> "
no-permission: "<red>You do not have permission."
player-not-found: "<red>Player is not online or cached. Use a UUID for offline players."
invalid-number: "<red>Points must be a whole number."
usage: "<yellow>Usage: <white>/reputation <show|top|bottom|tiers|history|add|remove|set|reset|reload>"
show: "<gray>{player}'s reputation: <white>{value}</white> · {tier}"
changed: "<green>{player}: <white>{old} → {new}</white> ({delta})"
unchanged: "<gray>{player}'s reputation did not change."
reason-required: "<red>Provide a meaningful reason (up to 160 characters)."
invalid-adjustment: "<red>The adjustment must be between 1 and {maximum}."
top-title: "<yellow>Highest reputation · page {page}"
bottom-title: "<yellow>Lowest reputation · page {page}"
leaderboard-empty: "<gray>No reputation entries on this page."
leaderboard-line: "<gray>#{position} <white>{player}</white> · {value} · {tier}"
tiers-title: "<yellow>Reputation tiers"
tier-line: "<gray>{minimum}+ · {tier}"
history-empty: "<gray>No reputation history for {player}."
history-title: "<yellow>History for {player} · page {page}"
history-line: "<gray>{time} <white>{delta}</white> by {actor}: {reason}"
reloaded: "<green>Configuration reloaded."
