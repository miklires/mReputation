config-version: 2
language: en_US
reputation:
  # Values are always clamped between minimum and maximum.
  default: 500
  minimum: 0
  maximum: 1000
  positive-threshold: 500
  points-above-threshold-per-action: 1
  maximum-adjustment-per-command: 1000
  minimum-reason-length: 3
  history-limit: 50
display:
  leaderboard-page-size: 10
# The highest matching minimum determines the displayed tier. Commands run only
# when entering a different tier and are empty by default.
tiers:
  - id: critical
    minimum: 0
    display: "<dark_red>Critical"
    enter-commands: []
  - id: restricted
    minimum: 250
    display: "<red>Restricted"
    enter-commands: []
  - id: neutral
    minimum: 500
    display: "<gray>Neutral"
    enter-commands: []
  - id: trusted
    minimum: 750
    display: "<green>Trusted"
    enter-commands: []
  - id: exemplary
    minimum: 900
    display: "<aqua>Exemplary"
    enter-commands: []
zero-action:
  # Potentially destructive; enable only after testing the command and exemptions.
  enabled: false
  # Runs as console when reputation reaches the configured minimum.
  command: "ban {player} Reputation reached zero"
metrics:
  enabled: true
  bstats-id: 33360
updates:
  enabled: true
  modrinth-project-id: "mReputation"
